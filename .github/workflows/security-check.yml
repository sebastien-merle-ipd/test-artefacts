name: Security Audit & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Audit des librairies
        run: |
          echo "🔍 Analyse des librairies en cours..."
          npm audit --audit-level=high || (
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ DÉPLOIEMENT BLOQUÉ"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Une ou plusieurs vulnérabilités HIGH ou"
            echo "CRITICAL ont été détectées."
            echo ""
            echo "👉 Actions requises :"
            echo "   1. Consulter le rapport npm audit ci-dessus"
            echo "   2. Mettre à jour les librairies concernées"
            echo "   3. Repusher une fois corrigé"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          )

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4