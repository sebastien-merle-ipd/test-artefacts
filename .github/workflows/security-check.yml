name: Security Audit & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Audit des librairies
        run: |
          echo "🔍 Audit des librairies en cours..."
          npm audit --audit-level=high || (
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ DÉPLOIEMENT BLOQUÉ"
            echo "   Vulnérabilité détectée dans une librairie."
            echo ""
            echo "👉 Actions requises :"
            echo "   1. Consulter le rapport ci-dessus"
            echo "   2. Mettre à jour la version CDN dans le HTML"
            echo "   3. Mettre à jour la version dans package.json"
            echo "   4. Repusher une fois corrigé"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          )

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4